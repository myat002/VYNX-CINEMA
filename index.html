
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>VYNX CINEMA</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292015;gap:10px}
.logo{font-size:22px;font-weight:900;color:#d6ad55;letter-spacing:2px}
button{cursor:pointer;border:0;border-radius:6px;padding:11px 16px;font-weight:bold}
.gold{background:#c49a43;color:#080808}
.dark{background:#252525;color:white}
main{padding:25px 5%}
.hero{padding:35px 22px;background:linear-gradient(120deg,#211a0e,#090909);border:1px solid #4c3b1d;border-radius:12px}
.hero h1{color:#e4bd68;font-size:34px;margin:0 0 10px}
.hero p{color:#bbb}
.search{width:100%;padding:14px;background:#171717;border:1px solid #393939;border-radius:7px;color:white;margin:22px 0}
.categories{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:25px}
.categories button{background:#202020;color:#ddd}
.categories button.active{background:#c49a43;color:#000}
.section-title{color:#d8b45e;margin:20px 0}
.movies{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px}
.movie{background:#151515;border:1px solid #292929;border-radius:9px;overflow:hidden}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#222}
.movie-info{padding:11px}
.movie-info h3{font-size:14px;margin:0 0 8px}
.movie-info p{font-size:12px;color:#aaa}
.movie-info button{width:100%;margin-top:5px}
.empty{color:#888;text-align:center;padding:50px 10px}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#000e;z-index:10;display:flex;align-items:center;justify-content:center;padding:15px}
.panel{background:#171717;border:1px solid #765d2c;border-radius:12px;padding:22px;width:100%;max-width:430px;max-height:90vh;overflow:auto}
.panel h2{color:#dfb95f}
.field{width:100%;padding:13px;margin:7px 0 14px;background:#090909;color:white;border:1px solid #444;border-radius:6px}
.field-label{font-size:12px;color:#bbb}
.panel button{margin:4px 3px 4px 0}
.close{float:right;background:#333;color:white}
.video-box{width:100%;max-width:850px}
video{width:100%;max-height:75vh;background:#000}
footer{text-align:center;padding:30px;color:#777;font-size:12px}
.message{font-size:13px;line-height:1.5;overflow-wrap:anywhere}
</style>
</head>

<body>

<header>
 <div class="logo">VYNX CINEMA</div>
 <button class="gold" id="founderBtn">FOUNDER LOGIN</button>
 <button class="gold hidden" id="adminBtn">ADMIN PANEL</button>
</header>

<main>
 <section class="hero">
  <h1>VYNX CINEMA</h1>
  <p>RELIVE YOUR MEMORIES</p>
  <p>Your favourite movies and series in one place.</p>
 </section>

 <input class="search" id="search" placeholder="Search movies and series...">

 <div class="categories" id="categories">
  <button class="active" data-cat="ALL">ALL</button>
  <button data-cat="MOVIES">MOVIES</button>
  <button data-cat="CARTOONS">CARTOONS</button>
  <button data-cat="K-DRAMA">K-DRAMA</button>
  <button data-cat="SERIES">SERIES</button>
 </div>

 <h3 class="section-title">LATEST VIDEOS</h3>
 <div class="movies" id="movieList"></div>
 <div class="empty" id="empty">No movies available yet.</div>
</main>

<footer>VYNX CINEMA · OFFICIAL</footer>

<!-- FOUNDER LOGIN -->
<div class="modal hidden" id="loginModal">
 <div class="panel">
  <button class="close" onclick="closeModal('loginModal')">CLOSE</button>
  <h2>FOUNDER LOGIN</h2>

  <label class="field-label">EMAIL</label>
  <input class="field" id="email" type="email" placeholder="Founder email" autocomplete="username">

  <label class="field-label">PASSWORD</label>
  <input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password">

  <button class="gold" id="loginButton" onclick="login()">LOGIN</button>
  <p id="loginMessage" class="message"></p>
 </div>
</div>

<!-- ADMIN PANEL -->
<div class="modal hidden" id="adminModal">
 <div class="panel">
  <button class="close" onclick="closeModal('adminModal')">CLOSE</button>
  <h2>FOUNDER DASHBOARD</h2>

  <input type="hidden" id="editId">

  <label class="field-label">MOVIE TITLE</label>
  <input class="field" id="title" placeholder="Movie title">

  <label class="field-label">RELEASE YEAR</label>
  <input class="field" id="year" type="number" placeholder="2026">

  <label class="field-label">CATEGORY</label>
  <select class="field" id="category">
   <option value="MOVIES">MOVIES</option>
   <option value="CARTOONS">CARTOONS</option>
   <option value="K-DRAMA">K-DRAMA</option>
   <option value="SERIES">SERIES</option>
  </select>

  <label class="field-label">POSTER IMAGE URL</label>
  <input class="field" id="poster" placeholder="https://example.com/poster.jpg">

  <label class="field-label">VIDEO URL</label>
  <input class="field" id="video" placeholder="Direct video URL">

  <button class="gold" onclick="saveMovie()">SAVE MOVIE</button>
  <button class="dark" onclick="resetForm()">CLEAR</button>
  <button class="dark" onclick="logout()">LOGOUT</button>

  <p id="adminMessage" class="message"></p>
  <hr>
  <h3>MANAGE MOVIES</h3>
  <div id="manageList"></div>
 </div>
</div>

<!-- VIDEO PLAYER -->
<div class="modal hidden" id="videoModal">
 <div class="panel video-box">
  <button class="close" onclick="closeVideo()">CLOSE</button>
  <h2 id="videoTitle">WATCH MOVIE</h2>
  <video id="player" controls playsinline></video>
  <p id="videoMessage" class="message"></p>
 </div>
</div>

<script>
// FIREBASE CONFIGURATION
const firebaseConfig = {
 apiKey: "AIzaSyBnO5ooSZabq5rfXig4k4wJUCtuYoDFupU",
 authDomain: "childhood-memories-a24c0.firebaseapp.com",
 projectId: "childhood-memories-a24c0",
 storageBucket: "childhood-memories-a24c0.firebasestorage.app",
 messagingSenderId: "708149198034",
 appId: "1:708149198034:web:251016911cdac126c7c10b",
 measurementId: "G-LZ5CYW1ZS9"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const FOUNDER_UID = "KrNRoIFmDAPRp7WTx6fQ4gQQhQ32";

let movies = [];
let selectedCategory = "ALL";
let unsubscribe = null;
let authReady = false;

const $ = id => document.getElementById(id);

// TELEGRAM MINI APP
if(window.Telegram && window.Telegram.WebApp){
 const tg = window.Telegram.WebApp;
 tg.ready();
 tg.expand();
}

// AUTH PERSISTENCE
async function setupAuth(){
 try{
  await auth.setPersistence(
   firebase.auth.Auth.Persistence.LOCAL
  );
 }catch(error){
  try{
   await auth.setPersistence(
    firebase.auth.Auth.Persistence.SESSION
   );
  }catch(secondError){
   await auth.setPersistence(
    firebase.auth.Auth.Persistence.NONE
   );
  }
 }
}

function isFounder(){
 return !!auth.currentUser &&
 auth.currentUser.uid === FOUNDER_UID;
}

function closeModal(id){
 $(id).classList.add("hidden");
}

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 })[c]);
}

// AUTHENTICATION
auth.onAuthStateChanged(async user=>{
 authReady = true;

 const allowed = !!user && user.uid === FOUNDER_UID;

 $("founderBtn").classList.toggle("hidden",allowed);
 $("adminBtn").classList.toggle("hidden",!allowed);

 if(user && !allowed){
  await auth.signOut();
  alert("Unauthorized account.");
 }

 if(allowed){
  loadManageList();
 }else{
  $("adminModal").classList.add("hidden");
 }
});

// LOGIN
async function login(){

 if(!authReady){
  $("loginMessage").textContent =
   "Please wait. Firebase is initializing...";
  return;
 }

 const email = $("email").value.trim();
 const password = $("password").value;

 if(!email || !password){
  $("loginMessage").textContent =
   "Please enter your email and password.";
  return;
 }

 $("loginButton").disabled = true;
 $("loginMessage").textContent = "Connecting to Firebase...";

 try{

  await setupAuth();

  const result = await auth.signInWithEmailAndPassword(
   email,
   password
  );

  if(result.user.uid !== FOUNDER_UID){
   await auth.signOut();
   throw new Error("This account is not the founder.");
  }

  $("loginMessage").textContent = "";
  $("password").value = "";

  closeModal("loginModal");
  openAdmin();

 }catch(error){

  const messages = {
   "auth/network-request-failed":
    "Network connection failed. Check internet and try again.",

   "auth/invalid-credential":
    "Email or password is incorrect. Check Firebase account.",

   "auth/user-not-found":
    "No Firebase account found for this email.",

   "auth/wrong-password":
    "Incorrect password. Reset it in Firebase.",

   "auth/invalid-email":
    "Please enter a valid email address.",

   "auth/unauthorized-domain":
    "Add myat002.github.io to Firebase Authorized Domains.",

   "auth/too-many-requests":
    "Too many attempts. Please wait and try again.",

   "auth/operation-not-allowed":
    "Enable Email/Password sign-in in Firebase Authentication."
  };

  $("loginMessage").textContent =
   messages[error.code] ||
   (error.code || "Error") + ": " + error.message;

 }finally{
  $("loginButton").disabled = false;
 }
}

// LOGOUT
async function logout(){
 try{
  await auth.signOut();
  closeModal("adminModal");
 }catch(error){
  alert(error.message);
 }
}

// MOVIE DATABASE
function startMovies(){

 if(unsubscribe) unsubscribe();

 $("empty").textContent = "Loading movies...";

 unsubscribe = db.collection("movies")
 .orderBy("createdAt","desc")
 .onSnapshot(snapshot=>{

  movies = snapshot.docs.map(doc=>({
   id:doc.id,
   ...doc.data()
  }));

  renderMovies();

  if(isFounder()){
   loadManageList();
  }

 },error=>{

  $("empty").textContent =
   "Unable to load movies: " + error.message;

 });
}

// RENDER MOVIES
function renderMovies(){

 const query = $("search").value.toLowerCase();

 const filtered = movies.filter(m=>{

  const category = m.category || "MOVIES";

  const matchCategory =
   selectedCategory === "ALL" ||
   category === selectedCategory;

  const matchSearch =
   (m.title || "").toLowerCase().includes(query);

  return matchCategory && matchSearch;
 });

 $("movieList").innerHTML = filtered.map(m=>`

  <article class="movie">

   <img class="poster"
    src="${escapeHTML(m.posterUrl || "")}"
    alt="${escapeHTML(m.title)}"
    onerror="this.style.visibility='hidden'">

   <div class="movie-info">

    <h3>${escapeHTML(m.title)}</h3>

    <p>
     ${escapeHTML(m.year)} ·
     ${escapeHTML(m.category || "MOVIES")}
    </p>

    <button class="gold"
     onclick="watchMovie('${m.id}')">
     WATCH MOVIE
    </button>

   </div>
  </article>

 `).join("");

 $("empty").classList.toggle(
  "hidden",
  filtered.length > 0
 );
}

$("search").addEventListener("input",renderMovies);

// CATEGORY FILTER
$("categories").addEventListener("click",e=>{

 const btn = e.target.closest("button[data-cat]");

 if(!btn) return;

 selectedCategory = btn.dataset.cat;

 document.querySelectorAll(".categories button")
 .forEach(b=>b.classList.remove("active"));

 btn.classList.add("active");

 renderMovies();
});

// VIDEO PLAYER
function watchMovie(id){

 const movie = movies.find(m=>m.id===id);

 if(!movie) return;

 if(!movie.videoUrl){
  alert("Video URL not found.");
  return;
 }

 $("videoTitle").textContent = movie.title;
 $("videoMessage").textContent = "";

 const player = $("player");

 player.src = movie.videoUrl;

 $("videoModal").classList.remove("hidden");

 player.load();
}

function closeVideo(){

 const player = $("player");

 player.pause();
 player.removeAttribute("src");
 player.load();

 closeModal("videoModal");
}

// ADMIN PANEL
function openAdmin(){

 if(!isFounder()){
  $("loginModal").classList.remove("hidden");
  return;
 }

 $("adminModal").classList.remove("hidden");

 loadManageList();
}

// RESET FORM
function resetForm(){

 $("editId").value = "";
 $("title").value = "";
 $("year").value = "";
 $("category").value = "MOVIES";
 $("poster").value = "";
 $("video").value = "";

 $("adminMessage").textContent = "";
}

// SAVE MOVIE
async function saveMovie(){

 if(!isFounder()){
  alert("Founder access required.");
  return;
 }

 const title = $("title").value.trim();
 const year = $("year").value.trim();
 const posterUrl = $("poster").value.trim();
 const videoUrl = $("video").value.trim();
 const category = $("category").value;
 const editId = $("editId").value;

 if(!title || !posterUrl || !videoUrl){
  $("adminMessage").textContent =
   "Please fill in all required fields.";
  return;
 }

 if(!/^https?:\/\//i.test(posterUrl) ||
    !/^https?:\/\//i.test(videoUrl)){
  $("adminMessage").textContent =
   "Enter valid HTTP or HTTPS URLs.";
  return;
 }

 $("adminMessage").textContent = "Saving...";

 try{

  const data = {
   title,
   year,
   posterUrl,
   videoUrl,
   category,
   updatedAt:
    firebase.firestore.FieldValue.serverTimestamp()
  };

  if(editId){

   await db.collection("movies")
    .doc(editId)
    .update(data);

  }else{

   data.createdAt =
    firebase.firestore.FieldValue.serverTimestamp();

   await db.collection("movies").add(data);

  }

  $("adminMessage").textContent =
   "Movie saved successfully.";

  resetForm();

 }catch(error){

  $("adminMessage").textContent =
   "Save failed: " + error.message;

 }
}

// MANAGE MOVIES
function loadManageList(){

 if(!isFounder()) return;

 $("manageList").innerHTML = movies.map(m=>`

  <div style="padding:12px;border-bottom:1px solid #444">

   <b>${escapeHTML(m.title)}</b>

   <br><br>

   <button class="gold"
    onclick="editMovie('${m.id}')">
    EDIT
   </button>

   <button class="dark"
    onclick="deleteMovie('${m.id}')">
    DELETE
   </button>

  </div>

 `).join("");

}

// EDIT MOVIE
function editMovie(id){

 if(!isFounder()) return;

 const m = movies.find(x=>x.id===id);

 if(!m) return;

 $("editId").value = m.id;
 $("title").value = m.title || "";
 $("year").value = m.year || "";
 $("category").value = m.category || "MOVIES";
 $("poster").value = m.posterUrl || "";
 $("video").value = m.videoUrl || "";

 $("adminMessage").textContent =
  "Editing: " + m.title;

}

// DELETE MOVIE
async function deleteMovie(id){

 if(!isFounder()) return;

 if(!confirm("Delete this movie?")) return;

 try{

  await db.collection("movies")
   .doc(id)
   .delete();

 }catch(error){

  alert(error.message);

 }
}

// BUTTONS
$("founderBtn").onclick = ()=>{
 $("loginModal").classList.remove("hidden");
};

$("adminBtn").onclick = openAdmin;

// START
startMovies();

</script>

</body>
</html>
