
name: Deploy VYNX VIP Mini App

on:
  push:
    branches:
      - main
    paths:
      - "vip/**"
      - ".github/workflows/deploy-vip-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vynx-vip-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload VIP Mini App
        uses: actions/upload-pages-artifact@v3
        with:
          path: vip

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
